name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Matchmaking server (unit + Postgres integration tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omg_test
          POSTGRES_USER: omg
          POSTGRES_PASSWORD: omg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omg -d omg_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/omg_test
      TEST_DATABASE_USER: omg
      TEST_DATABASE_PASSWORD: omg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f server/pom.xml verify
      - name: Matchmaking policy simulation (informational)
        run: java -cp server/target/omg-matchmaking-server.jar com.game.server.sim.Simulation 10 7 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: server/target/surefire-reports/

  desktop-tests:
    name: Desktop app tests (matchmaking + leaderboard packages)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The JavaFX client is built in IntelliJ with the jars in lib/; these packages have no
      # JavaFX dependency, so they compile and run here with the same jars.
      - name: Compile and run
        run: |
          mkdir -p out/classes out/test-classes
          javac -d out/classes -cp "lib/*" src/com/game/matchmaking/*.java src/com/game/leaderboard/*.java src/com/game/leaderboard/PlayerComparator/*.java
          javac -d out/test-classes -cp "out/classes:lib/*" test/com.game/matchmaking/*.java test/com.game/leaderboard/*.java
          java -jar lib/junit-platform-console-standalone-1.10.0.jar execute \
            -cp "out/classes:out/test-classes:lib/jackson-core-2.12.6.jar:lib/jackson-databind-2.12.6.1.jar:lib/jackson-annotations-2.12.6.jar" \
            --scan-classpath --disable-banner --details=summary --fail-if-no-tests

  monitoring:
    name: Alert rules, Prometheus config, Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: promtool check + alert unit tests
        run: |
          docker run --rm -v "$PWD/server/monitoring/prometheus:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/server/monitoring/prometheus:/etc/prometheus" -w /etc/prometheus --entrypoint promtool \
            prom/prometheus:v2.54.1 test rules rules_test.yml
      - name: Dashboard JSON parses
        run: python3 -c "import json; d = json.load(open('server/monitoring/grafana/dashboards/matchmaking.json')); print(len(d['panels']), 'panels')"
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize server/k8s | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -

  stack:
    name: Docker image + compose stack + k6 smoke load test
    runs-on: ubuntu-24.04
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (waits for health checks)
        working-directory: server
        run: docker compose up -d --build --wait
      - name: Metrics endpoint passes promtool lint
        run: |
          curl -sf localhost:8080/metrics > metrics.txt
          docker run --rm -i --entrypoint promtool prom/prometheus:v2.54.1 check metrics < metrics.txt
      - name: k6 smoke test (fails on SLO thresholds)
        working-directory: server
        run: |
          mkdir -p load/results && chmod 777 load/results
          docker compose --profile load run --rm -e RATE=20 -e DURATION=30s k6 \
            run --summary-export /scripts/results/summary.json /scripts/matchmaking.js
      - name: Prometheus scraped the run
        run: |
          sleep 10
          curl -sf 'localhost:9090/api/v1/query?query=sum(omg_matches_total)' | tee query.json
          python3 -c "import json; v = float(json.load(open('query.json'))['data']['result'][0]['value'][1]); assert v > 100, v"
      - name: Graceful shutdown drains
        working-directory: server
        run: |
          docker compose stop -t 15 matchmaker
          docker compose logs matchmaker | tail -n 5 | grep -q '"msg":"stopped"'
      - name: Logs
        if: failure()
        working-directory: server
        run: docker compose logs --no-color | tail -n 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-smoke
          path: server/load/results/
      - if: always()
        working-directory: server
        run: docker compose down -v
