# The whole stack on one machine:
#
#   docker compose up -d --build                  matchmaker + Postgres + Prometheus + Grafana
#   open http://localhost:3000                    Grafana (anonymous viewer), dashboard "OMG matchmaking"
#   docker compose --profile load run --rm k6     load test against the running stack
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omg
      POSTGRES_USER: omg
      POSTGRES_PASSWORD: omg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omg -d omg"]
      interval: 5s
      timeout: 3s
      retries: 10

  matchmaker:
    build: .
    image: omg-matchmaker:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/omg
      DATABASE_USER: omg
      DATABASE_PASSWORD: omg
      DATABASE_POOL_SIZE: "16"
    ports:
      - "8080:8080"
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - matchmaker

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/matchmaking.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    command: ["run", "/scripts/matchmaking.js"]
    environment:
      BASE_URL: http://matchmaker:8080
      RATE: ${RATE:-100}
      DURATION: ${DURATION:-2m}
    volumes:
      - ./load:/scripts
    depends_on:
      - matchmaker

volumes:
  pgdata:
