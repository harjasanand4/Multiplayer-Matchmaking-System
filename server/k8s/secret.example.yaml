# Not applied by kustomize. Create the real one out of band, e.g.
#   kubectl -n omg create secret generic matchmaker-db --from-literal=DATABASE_USER=omg --from-literal=DATABASE_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: matchmaker-db
  namespace: omg
type: Opaque
stringData:
  DATABASE_USER: omg
  DATABASE_PASSWORD: change-me
