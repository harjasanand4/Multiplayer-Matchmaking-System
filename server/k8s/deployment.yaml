apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker
  labels:
    app.kubernetes.io/name: matchmaker
spec:
  # The queue lives in memory, so exactly one matchmaker owns it. Two replicas would split
  # players into two pools that never see each other; Recreate avoids that overlap during
  # rollouts too. (Scaling out means sharding queues by game or region, or moving the pool
  # into shared storage; see the README.)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matchmaker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmaker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matchmaker
          image: omg-matchmaker
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: matchmaker
            - secretRef:
                name: matchmaker-db
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
