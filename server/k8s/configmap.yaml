apiVersion: v1
kind: ConfigMap
metadata:
  name: matchmaker
  labels:
    app.kubernetes.io/name: matchmaker
data:
  DATABASE_URL: jdbc:postgresql://postgres.omg.svc.cluster.local:5432/omg
  DATABASE_POOL_SIZE: "16"
  TICK_MS: "100"
  WINDOW_BASE: "50"
  WINDOW_WIDEN_PER_S: "25"
  WINDOW_MAX: "400"
  TICKET_TIMEOUT_S: "60"
  SHUTDOWN_DRAIN_S: "5"
