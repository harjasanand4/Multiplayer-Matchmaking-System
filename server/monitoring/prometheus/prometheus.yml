# Prometheus for docker compose: scrapes the matchmaker every 5 s and evaluates the rules.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: matchmaker
    metrics_path: /metrics
    static_configs:
      - targets: ["matchmaker:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
