# Unit tests for the alerts: `promtool test rules rules_test.yml` (runs in CI).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # Healthy traffic: nothing fires.
  - interval: 1m
    input_series:
      - series: 'up{job="matchmaker", instance="matchmaker:8080"}'
        values: '1x120'
      - series: 'omg_matchmaker_last_tick_timestamp_seconds{job="matchmaker", instance="matchmaker:8080"}'
        values: '0+60x120'
      - series: 'omg_http_requests_total{route="/v1/tickets", method="POST", status="201"}'
        values: '0+600x120'
      - series: 'omg_time_to_match_seconds_bucket{game="checkers", le="10"}'
        values: '0+100x120'
      - series: 'omg_time_to_match_seconds_count{game="checkers"}'
        values: '0+100x120'
      - series: 'omg_tickets_expired_total{game="checkers"}'
        values: '0x120'
      - series: 'omg_queue_depth{game="checkers"}'
        values: '20x120'
    alert_rule_test:
      - {eval_time: 119m, alertname: MatchmakerDown, exp_alerts: []}
      - {eval_time: 119m, alertname: MatchmakerStalled, exp_alerts: []}
      - {eval_time: 119m, alertname: MatchmakingSLOFastBurn, exp_alerts: []}
      - {eval_time: 119m, alertname: HighServerErrorRate, exp_alerts: []}
      - {eval_time: 119m, alertname: QueueBacklog, exp_alerts: []}
    promql_expr_test:
      - expr: omg:slo_errors:ratio_rate1h
        eval_time: 119m
        exp_samples:
          - labels: 'omg:slo_errors:ratio_rate1h'
            value: 0

  # The process dies at minute 5: the page goes out after the 1 minute "for".
  - interval: 1m
    input_series:
      - series: 'up{job="matchmaker", instance="matchmaker:8080"}'
        values: '1x5 0x10'
    alert_rule_test:
      - {eval_time: 5m, alertname: MatchmakerDown, exp_alerts: []}
      - eval_time: 7m
        alertname: MatchmakerDown
        exp_alerts:
          - exp_labels: {severity: page, job: matchmaker, instance: "matchmaker:8080"}
            exp_annotations:
              summary: Matchmaker is not answering scrapes
              description: Prometheus has not been able to scrape matchmaker:8080 for a minute. Players can't join or poll.

  # The matchmaking loop freezes at minute 5 while the API keeps serving.
  - interval: 1m
    input_series:
      - series: 'omg_matchmaker_last_tick_timestamp_seconds{job="matchmaker", instance="matchmaker:8080"}'
        values: '0+60x5 300x10'
    alert_rule_test:
      - {eval_time: 5m, alertname: MatchmakerStalled, exp_alerts: []}
      - eval_time: 8m
        alertname: MatchmakerStalled
        exp_alerts:
          - exp_labels: {severity: page, job: matchmaker, instance: "matchmaker:8080"}
            exp_annotations:
              summary: Matchmaking loop has stopped
              description: No matchmaking pass for 3m 0s. The API still answers but nobody gets matched; the liveness probe will restart the pod.

  # From minute 60, only 5 % of players are matched within 10 s.
  - interval: 1m
    input_series:
      - series: 'omg_time_to_match_seconds_bucket{game="checkers", le="10"}'
        values: '0+100x60 6000+5x60'
      - series: 'omg_time_to_match_seconds_count{game="checkers"}'
        values: '0+100x120'
      - series: 'omg_tickets_expired_total{game="checkers"}'
        values: '0x120'
    alert_rule_test:
      - {eval_time: 100m, alertname: MatchmakingSLOFastBurn, exp_alerts: []}
      - eval_time: 115m
        alertname: MatchmakingSLOFastBurn
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: Players are waiting too long to be matched (fast burn)
              description: 87.17% of players over the last hour waited more than 10 s or timed out.

  # Expired tickets count against the SLO too, even when everyone who is matched is fast.
  - interval: 1m
    input_series:
      - series: 'omg_time_to_match_seconds_bucket{game="connect4", le="10"}'
        values: '0+10x120'
      - series: 'omg_time_to_match_seconds_count{game="connect4"}'
        values: '0+10x120'
      - series: 'omg_tickets_expired_total{game="connect4"}'
        values: '0+90x120'
    alert_rule_test:
      - eval_time: 119m
        alertname: MatchmakingSLOFastBurn
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: Players are waiting too long to be matched (fast burn)
              description: 90% of players over the last hour waited more than 10 s or timed out.

  # About 5 % of requests start failing at minute 10.
  - interval: 1m
    input_series:
      - series: 'omg_http_requests_total{route="/v1/tickets", method="POST", status="201"}'
        values: '0+1000x30'
      - series: 'omg_http_requests_total{route="/v1/tickets", method="POST", status="503"}'
        values: '0x10 0+50x20'
    alert_rule_test:
      - {eval_time: 12m, alertname: HighServerErrorRate, exp_alerts: []}
      - eval_time: 25m
        alertname: HighServerErrorRate
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: More than 2 % of API requests are failing
              description: 4.762% of requests returned 5xx over 5 minutes. Check omg_store_errors_total for database trouble.

  # A database blip: matches fail to save once.
  - interval: 1m
    input_series:
      - series: 'omg_match_persist_failures_total{job="matchmaker", instance="matchmaker:8080"}'
        values: '0x5 2x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: MatchPersistFailures
        exp_alerts:
          - exp_labels: {severity: ticket, job: matchmaker, instance: "matchmaker:8080"}
            exp_annotations:
              summary: Matches are failing to save
              description: 2 matches could not be written to Postgres in 5 minutes (players were put back in the queue).
